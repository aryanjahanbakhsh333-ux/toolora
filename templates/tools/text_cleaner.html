{% extends "base.html" %}

{% block title %}پاک‌کنندگی متن - Toolora{% endblock %}

{% block content %}
<div class="container">
    <div class="tool-page">
        <div class="tool-header">
            <h1>🧹 پاک‌کنندگی متن</h1>
            <p>تمیز کردن متن، حذف فاصله‌های اضافی و کاراکترهای غیرضروری</p>
        </div>

        <div class="tool-content">
            <div class="input-section">
                <label for="textInput">متن خود را اینجا وارد کنید:</label>
                <textarea id="textInput" placeholder="متن خود را اینجا بنویسید..."></textarea>
                
                <div class="options-section">
                    <h3>گزینه‌های تمیزکاری:</h3>
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="removeExtraSpaces" checked>
                            حذف فاصله‌های اضافی
                        </label>
                        <label>
                            <input type="checkbox" id="removeEmptyLines">
                            حذف خطوط خالی
                        </label>
                        <label>
                            <input type="checkbox" id="removeSpecialChars">
                            حذف کاراکترهای خاص
                        </label>
                        <label>
                            <input type="checkbox" id="lowercase">
                            تبدیل به حروف کوچک
                        </label>
                        <label>
                            <input type="checkbox" id="uppercase">
                            تبدیل به حروف بزرگ
                        </label>
                        <label>
                            <input type="checkbox" id="trim">
                            حذف فاصله از شروع و انتها
                        </label>
                    </div>
                </div>
                
                <button class="btn btn-primary" onclick="cleanText()">تمیز کردن</button>
            </div>

            <div class="output-section" id="resultSection" style="display: none;">
                <h2>متن تمیزشده:</h2>
                <div class="result-text-box">
                    <textarea id="resultText" readonly></textarea>
                    <button class="btn btn-secondary" onclick="copyResult()">کپی کردن</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function cleanText() {
    const text = document.getElementById('textInput').value;
    
    if (!text) {
        alert('لطفاً متن را وارد کنید');
        return;
    }
    
    const options = {
        text: text,
        remove_extra_spaces: document.getElementById('removeExtraSpaces').checked,
        remove_empty_lines: document.getElementById('removeEmptyLines').checked,
        remove_special_chars: document.getElementById('removeSpecialChars').checked,
        lowercase: document.getElementById('lowercase').checked,
        uppercase: document.getElementById('uppercase').checked,
        trim: document.getElementById('trim').checked
    };
    
    try {
        const response = await fetch('/api/text-cleaner', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(options)
        });
        
        const data = await response.json();
        document.getElementById('resultText').value = data.cleaned_text;
        document.getElementById('resultSection').style.display = 'block';
    } catch (error) {
        console.error('Error:', error);
        alert('خطا در پردازش');
    }
}

function copyResult() {
    const resultText = document.getElementById('resultText');
    resultText.select();
    document.execCommand('copy');
    alert('متن کپی شد!');
}

// Enter key support
document.getElementById('textInput')?.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.ctrlKey) {
        cleanText();
    }
});
</script>
{% endblock %}
